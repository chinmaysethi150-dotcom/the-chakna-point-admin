name: Unpack Admin Project

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Admin Project
        run: |
          unzip -o TheChaknaPoint_Admin_Ready.zip -d .
          rm -f TheChaknaPoint_Admin_Ready.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unpack admin Android project" || echo "Nothing to commit"
          git push
