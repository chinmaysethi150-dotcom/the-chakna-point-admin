name: Unpack Admin Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack Admin ZIP
        run: |
          mkdir -p extracted
          unzip -o "TheChaknaPoint_Admin_Ready.zip" -d extracted

          cp -r extracted/* .

          rm -rf extracted
          rm -f "TheChaknaPoint_Admin_Ready.zip"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "Extract Admin Android project"
          git push
