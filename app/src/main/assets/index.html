<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Chakna Point Admin</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}.top{background:#0f172a;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:25px;margin-top:6px}.muted{color:#64748b;font-size:13px}.nav{display:flex;gap:8px;overflow:auto;padding:12px 0}.nav button{background:white}.nav .active,.primary{background:#16a34a;color:white}button{border:0;border-radius:10px;padding:11px 14px}.secondary{background:#e2e8f0}.danger{background:#dc2626;color:white}input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}.hidden{display:none}.login{max-width:430px;margin:8vh auto}.err{color:#dc2626;font-size:14px;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}.modal .card{width:min(600px,100%)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login" class="wrap login"><div class="card"><h1>The Chakna Point</h1><div class="muted">Admin Panel</div><p>Secure Admin Login</p>
<label>Email</label><input id="email" type="email" placeholder="Admin email"><label>Password</label><input id="password" type="password" placeholder="Password">
<button class="primary" style="width:100%" onclick="login()">Login</button><div id="loginErr" class="err"></div></div></div>
<div id="app" class="hidden"><header class="top"><b>🛒 The Chakna Point — Admin</b><button class="secondary" onclick="logout()">Logout</button></header>
<main class="wrap"><div class="nav"><button class="active" onclick="tab('dashboard',this)">Dashboard</button><button onclick="tab('orders',this)">Orders</button><button onclick="tab('products',this)">Products</button><button onclick="tab('customers',this)">Customers</button><button onclick="tab('sales',this)">Sales</button></div>
<section id="dashboard"><div class="grid"><div class="card stat"><div class="muted">Total Orders</div><b id="sOrders">0</b></div><div class="card stat"><div class="muted">Pending</div><b id="sPending">0</b></div><div class="card stat"><div class="muted">Customers</div><b id="sCustomers">0</b></div><div class="card stat"><div class="muted">Sales</div><b id="sSales">₹0</b></div></div><div class="card"><h3>Quick Actions</h3><div class="row"><button class="primary" onclick="tab('orders')">View Orders</button><button class="secondary" onclick="openProduct()">+ Add Product</button></div></div></section>
<section id="orders" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><h2>Orders</h2><button class="secondary" onclick="loadAll()">Refresh</button></div><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="ordersBody"></tbody></table></div></div></section>
<section id="products" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><h2>Products</h2><button class="primary" onclick="openProduct()">+ Add Product</button></div><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Price</th><th>Visible</th><th>Action</th></tr></thead><tbody id="productsBody"></tbody></table></div></div></section>
<section id="customers" class="hidden"><div class="card"><h2>Customers</h2><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Phone</th><th>Address</th></tr></thead><tbody id="customersBody"></tbody></table></div></div></section>
<section id="sales" class="hidden"><div class="card"><h2>Sales Summary</h2><div id="salesText">Loading…</div></div></section></main></div>
<div id="productModal" class="modal hidden"><div class="card"><h2 id="pmTitle">Add Product</h2><input id="pid" type="hidden"><label>Name</label><input id="pname"><label>Price (₹)</label><input id="pprice" type="number"><label>Image URL (optional)</label><input id="pimage"><label>Category</label><input id="pcat" value="Chakna"><div class="row"><button class="primary" onclick="saveProduct()">Save</button><button class="secondary" onclick="closeProduct()">Cancel</button></div><div id="pErr" class="err"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<script>
let auth,db,orders=[],products=[],customers=[];
function init(){if(String(FIREBASE_CONFIG.apiKey||'').startsWith('PASTE_')){loginErr.textContent='Firebase config अभी जोड़ना बाकी है।';return}firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async u=>{if(!u){login.classList.remove('hidden');app.classList.add('hidden');return}if(await admin(u.uid)){login.classList.add('hidden');app.classList.remove('hidden');loadAll()}else{loginErr.textContent='यह account Admin नहीं है।';auth.signOut()}})}
async function admin(uid){let d=await db.collection('admins').doc(uid).get();return d.exists&&d.data().active===true}
async function login(){loginErr.textContent='';try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(e){loginErr.textContent=e.message}}
async function logout(){await auth.signOut()}
function tab(id,b){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}}
async function loadAll(){await Promise.all([loadOrders(),loadProducts(),loadCustomers()]);stats();sales()}
async function loadOrders(){let s=await db.collection('orders').orderBy('createdAt','desc').limit(200).get();orders=s.docs.map(d=>({id:d.id,...d.data()}));ordersBody.innerHTML=orders.map(o=>'<tr><td>#'+o.id.slice(-6).toUpperCase()+'</td><td>'+esc(o.customerName||o.name||'-')+'</td><td>₹'+Number(o.total||0)+'</td><td>'+esc(o.status||'New')+'</td><td><select onchange="status(\''+o.id+'\',this.value)">'+['New','Accepted','Preparing','Ready','Delivered','Cancelled'].map(v=>'<option '+(v===(o.status||'New')?'selected':'')+'>'+v+'</option>').join('')+'</select></td></tr>').join('')}
async function status(id,v){await db.collection('orders').doc(id).update({status:v,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});loadAll()}
async function loadProducts(){let s=await db.collection('products').orderBy('name').get();products=s.docs.map(d=>({id:d.id,...d.data()}));productsBody.innerHTML=products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>₹'+Number(p.price||0)+'</td><td>'+(p.visible!==false?'Yes':'No')+'</td><td><button class="secondary" onclick="edit(\''+p.id+'\')">Edit</button> <button class="danger" onclick="del(\''+p.id+'\')">Delete</button></td></tr>').join('')}
function openProduct(p){productModal.classList.remove('hidden');pid.value=p?.id||'';pname.value=p?.name||'';pprice.value=p?.price??'';pimage.value=p?.image||'';pcat.value=p?.category||'Chakna';pmTitle.textContent=p?'Edit Product':'Add Product';pErr.textContent=''}
function edit(id){openProduct(products.find(p=>p.id===id))} function closeProduct(){productModal.classList.add('hidden')}
async function saveProduct(){try{let d={name:pname.value.trim(),price:Number(pprice.value),image:pimage.value.trim(),category:pcat.value.trim()||'Chakna',visible:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(!d.name)throw Error('Name डालें');if(pid.value)await db.collection('products').doc(pid.value).update(d);else{d.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('products').add(d)}closeProduct();loadProducts()}catch(e){pErr.textContent=e.message}}
async function del(id){if(confirm('Product delete करें?')){await db.collection('products').doc(id).delete();loadProducts()}}
async function loadCustomers(){let s=await db.collection('customers').limit(300).get();customers=s.docs.map(d=>({id:d.id,...d.data()}));customersBody.innerHTML=customers.map(c=>'<tr><td>'+esc(c.name||'-')+'</td><td>'+esc(c.phone||'-')+'</td><td>'+esc(c.address||'-')+'</td></tr>').join('')}
function stats(){sOrders.textContent=orders.length;sPending.textContent=orders.filter(o=>!['Delivered','Cancelled'].includes(o.status||'New')).length;sCustomers.textContent=customers.length;sSales.textContent='₹'+orders.filter(o=>o.status==='Delivered').reduce((a,o)=>a+Number(o.total||0),0)}
function sales(){let a=orders.filter(o=>o.status==='Delivered');salesText.innerHTML='<p><b>Delivered orders:</b> '+a.length+'</p><p><b>Total delivered sales:</b> ₹'+a.reduce((x,o)=>x+Number(o.total||0),0)+'</p>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} init();
</script></body></html>
